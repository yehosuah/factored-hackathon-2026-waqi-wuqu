# Standalone synthetic demo: isolated state, no AWS or ML mounts.
name: factored-demo
x-etl: &etl
  build: .
  image: ${COMPOSE_PROJECT_NAME}-etl
  user: "${DEMO_UID:?Run scripts/demo.py}:${DEMO_GID:?Run scripts/demo.py}"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,mode=1777
  volumes:
    - ${DEMO_STATE:?Run scripts/demo.py}/raw:/state/raw
    - ${DEMO_STATE}/extract:/state/extract
    - ${DEMO_STATE}/processed:/state/processed
services:
  postgres:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    entrypoint: [/bin/sh, /usr/local/bin/factored-pg-entrypoint.sh]
    command: [postgres]
    environment:
      POSTGRES_USER: factored_admin
      POSTGRES_DB: factored
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_password, etl_password, backend_password]
    volumes:
      - demo-postgres:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - ./docker/pg-entrypoint.sh:/usr/local/bin/factored-pg-entrypoint.sh:ro
    tmpfs:
      - /run/factored-secrets:mode=0700
    healthcheck:
      test: [CMD-SHELL, pg_isready -U factored_admin -d factored]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  fixture:
    <<: *etl
    command: [factored-demo-fixture, --raw-root, /state/raw, --extract-root, /state/extract]
    healthcheck:
      disable: true
  etl:
    <<: *etl
    command: [factored-etl, serve, --offline, --manifest, /state/extract/demo-manifest.json]
    environment:
      ETL_RAW_ROOT: /state/raw
      ETL_EXTRACT_ROOT: /state/extract
      ETL_OUTPUT_ROOT: /state/processed
      ETL_DB_HOST: postgres
      ETL_DB_PASSWORD_FILE: /run/secrets/etl_password
      ETL_INTERVAL_SECONDS: "300"
      AWS_EC2_METADATA_DISABLED: "true"
    secrets: [etl_password]
    depends_on:
      fixture:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      interval: 2s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped
  handoff-grants:
    <<: *etl
    command: [python, -m, factored_bank.demo.grants]
    environment:
      ETL_DB_HOST: postgres
      ETL_DB_USER: factored_admin
      ETL_DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - ${BCK_BUILD_CONTEXT}/deploy/handoff-read-grants.sql:/bootstrap/handoff-read-grants.sql:ro
    healthcheck:
      disable: true
    depends_on:
      etl:
        condition: service_healthy
  backend-bootstrap:
    image: ${COMPOSE_PROJECT_NAME}-backend
    build: ${BCK_BUILD_CONTEXT}
    user: "${DEMO_UID}:${DEMO_GID}"
    command: [python, /bootstrap/demo-backend.py]
    environment: &backend-environment
      BCK_DATA_ENABLED: "true"
      BCK_ENVIRONMENT: test
      BCK_DB_HOST: postgres
      BCK_DB_PASSWORD_FILE: /run/secrets/backend_password
      BCK_DEMO_PASSWORD_FILE: /run/secrets/demo_password
      BCK_CONVERSATION_ADAPTER: ${DEMO_CONVERSATION_ADAPTER:-stub}
    secrets: [backend_password, demo_password, other_demo_password, agent_password]
    volumes:
      - ./docker/demo-backend.py:/bootstrap/demo-backend.py:ro
    healthcheck:
      disable: true
    depends_on:
      handoff-grants:
        condition: service_completed_successfully
  backend:
    build: ${BCK_BUILD_CONTEXT:?Provide the independent backend checkout}
    image: ${COMPOSE_PROJECT_NAME}-backend
    user: "${DEMO_UID}:${DEMO_GID}"
    ports:
      - "127.0.0.1:${DEMO_PORT:-8010}:8000"
    environment: *backend-environment
    secrets: [backend_password, demo_password]
    depends_on:
      backend-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      interval: 2s
      timeout: 3s
      start_period: 60s
      retries: 3
    restart: unless-stopped
volumes:
  demo-postgres:
secrets:
  postgres_password:
    file: ${DEMO_STATE}/secrets/postgres_password
  etl_password:
    file: ${DEMO_STATE}/secrets/etl_password
  backend_password:
    file: ${DEMO_STATE}/secrets/backend_password
  demo_password:
    file: ${DEMO_STATE}/secrets/demo_password
  other_demo_password:
    file: ${DEMO_STATE}/secrets/other_demo_password
  agent_password:
    file: ${DEMO_STATE}/secrets/agent_password
